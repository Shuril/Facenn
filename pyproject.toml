[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facenn"
version = "0.1.0"
description = "High-performance face recognition library based on PyTorch"
authors = [
  { name = "Shuril", email = "shuril@example.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "opencv-python>=4.5.5",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "onnxruntime>=1.15.0",
    "onnx>=1.14.0",
    "onnxscript>=0.1.0",
    "timm>=0.9.0"
]

[project.urls]
"Homepage" = "https://github.com/Shuril/Facenn"
"Bug Tracker" = "https://github.com/Shuril/Facenn/issues"
