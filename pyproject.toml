[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facenn"
version = "0.2.0"
description = "Fast, lightweight face recognition and attribute analysis library using PyTorch and ONNX Runtime"
authors = [
  { name = "Shuril", email = "cara26@bk.ru" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "opencv-python>=4.7.0",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "onnxruntime>=1.15.0",
    "onnx>=1.14.0",
    "timm>=0.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Shuril/Facenn"
"Bug Tracker" = "https://github.com/Shuril/Facenn/issues"

